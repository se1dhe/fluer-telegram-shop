name: FLEUR mobile checkout E2E
on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - '.github/workflows/mobile-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://fluer-telegram-shop.vercel.app
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test tooling
        run: npm install --no-save @playwright/test@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile shop E2E
        run: npx playwright test tests/checkout.spec.mjs --reporter=line --workers=1
