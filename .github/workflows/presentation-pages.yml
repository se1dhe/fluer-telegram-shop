name: Publish FLEUR presentation on GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'public/fleur/**'
      - '.github/workflows/presentation-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fleur-showcase-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload presentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: public/fleur
      - name: Deploy presentation
        id: deployment
        uses: actions/deploy-pages@v4
